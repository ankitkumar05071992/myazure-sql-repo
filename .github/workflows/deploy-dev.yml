name: Deploy DACPAC to DEV

on:
  workflow_dispatch:

jobs:
  deploy-dev:

    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download DACPAC Artifact
        uses: actions/download-artifact@v4
        with:
          name: sqldbartifact
          path: artifact

      - name: Install SqlPackage
        run: |
          dotnet tool install -g microsoft.sqlpackage
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Verify DACPAC
        run: |
          find artifact -name "*.dacpac"

      - name: Deploy DACPAC
        run: |
          sqlpackage \
            /Action:Publish \
            /SourceFile:artifact/Database.dacpac \
            /TargetServerName:${{ secrets.SQL_SERVER }} \
            /TargetDatabaseName:${{ secrets.SQL_DATABASE }} \
            /TargetUser:${{ secrets.SQL_USERNAME }} \
            /TargetPassword:${{ secrets.SQL_PASSWORD }}
