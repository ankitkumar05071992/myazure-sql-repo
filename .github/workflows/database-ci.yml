name: SQL Database Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Check OS
        run: |
          echo "Runner OS:"
          uname -a
          echo "Ubuntu version:"
          lsb_release -a

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Find SQL project
        run: |
          find . -name "*.sqlproj" -print

      - name: Build SQL project
        run: |
          dotnet build $(find . -name "*.sqlproj" | head -n 1) \
            --configuration Release

      - name: Find DACPAC
        run: |
          echo "DACPAC files:"
          find . -name "*.dacpac" -print

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          find . -name "*.dacpac" -exec cp {} artifact/ \;

      - name: Upload DACPAC
        uses: actions/upload-artifact@v4
        with:
          name: sqldbartifact
          path: artifact/
