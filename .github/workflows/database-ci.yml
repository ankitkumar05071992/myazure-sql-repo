name: SQL Database CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ==========================================================
  # CI - BUILD DATABASE PROJECT
  # ==========================================================
  build:
    name: Build SQL Database
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Check OS
        run: |
          echo "Runner OS:"
          uname -a

          echo "Ubuntu version:"
          lsb_release -a

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Find SQL project
        run: |
          echo "SQL Projects:"
          find . -name "*.sqlproj" -print

      - name: Build SQL project
        run: |
          SQL_PROJECT=$(find . -name "*.sqlproj" | head -n 1)

          echo "Building:"
          echo "$SQL_PROJECT"

          dotnet build "$SQL_PROJECT" \
            --configuration Release

      - name: Find DACPAC
        run: |
          echo "DACPAC files:"
          find . -name "*.dacpac" -print

      - name: Prepare DACPAC artifact
        run: |
          set -e

          mkdir -p artifact

          find . -name "*.dacpac" -exec cp {} artifact/ \;

          echo "Artifact contents:"
          ls -lah artifact/

          if [ -z "$(find artifact -name '*.dacpac' -print -quit)" ]; then
            echo "ERROR: No DACPAC found!"
            exit 1
          fi

      - name: Upload DACPAC
        uses: actions/upload-artifact@v4
        with:
          name: sqldbartifact
          path: artifact/


  # ==========================================================
  # CD - DEPLOY TO DEV
  # ==========================================================
  deploy-dev:
    name: Deploy DACPAC to DEV

    needs: build

    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:

      - name: Download DACPAC Artifact
        uses: actions/download-artifact@v4
        with:
          name: sqldbartifact
          path: artifact

      - name: Verify DACPAC
        run: |
          echo "Downloaded artifact:"
          find artifact -type f -print

          echo ""
          echo "DACPAC files:"
          find artifact -name "*.dacpac" -print

      - name: Install SqlPackage
        run: |
          dotnet tool install -g microsoft.sqlpackage

          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Verify SqlPackage
        run: |
          sqlpackage /version

      - name: Deploy DACPAC to Azure SQL
        run: |
          sqlpackage \
            /Action:Publish \
            /SourceFile:artifact/Database.dacpac \
            /TargetServerName:"${{ secrets.SQL_SERVER }}" \
            /TargetDatabaseName:"${{ secrets.SQL_DATABASE }}" \
            /TargetUser:"${{ secrets.SQL_USERNAME }}" \
            /TargetPassword:"${{ secrets.SQL_PASSWORD }}" \
            /TargetEncryptConnection:True \
            /TargetTrustServerCertificate:False
